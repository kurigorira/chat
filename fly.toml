# app名はfly launchで自動設定されます
app = "your-app-name"
primary_region = "nrt"

[build]

[env]
  PORT = "3000"
  DATABASE_DIR = "/data"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "chat_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
